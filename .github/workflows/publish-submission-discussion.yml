name: Publish approved submission to Discussions

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  discussions: write
  pull-requests: read

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'submission/issue-') ||
      startsWith(github.event.pull_request.head.ref, 'submission/update-issue-')) &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract approved work ID
        id: work
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const body = process.env.PR_BODY || ''
          const match = body.match(/Submission ID:\s*([a-zA-Z0-9_.-]{1,80})/)
          if (!match) throw new Error('合并 PR 缺少 Submission ID，已停止发布。')
          const fs = await import('node:fs/promises')
          await fs.appendFile(process.env.GITHUB_OUTPUT, `work_id=${match[1]}\n`)
          NODE

      - name: Publish Discussion record
        env:
          DISCUSSIONS_TOKEN: ${{ secrets.DISCUSSIONS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORK_ID: ${{ steps.work.outputs.work_id }}
        run: node scripts/discussions.mjs
