name: Turn issue submission into PR

on:
  issues:
    types: [labeled, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  submit:
    if: >-
      github.event.issue.state == 'open' &&
      (contains(join(github.event.issue.labels.*.name, ','), 'submission:work') ||
      contains(join(github.event.issue.labels.*.name, ','), 'submission:update'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: submission-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      SUBMITTED_BY: ${{ github.event.issue.user.login }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RESULT_FILE: submission-result.json
      SUBMISSION_MODE: ${{ contains(join(github.event.issue.labels.*.name, ','), 'submission:update') && 'update' || 'create' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check for an existing open submission PR
        id: existing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SUBMISSION_MODE: ${{ env.SUBMISSION_MODE }}
        with:
          script: |
            const prefix = process.env.SUBMISSION_MODE === 'update' ? 'submission/update-issue' : 'submission/issue'
            const branch = `${prefix}-${process.env.ISSUE_NUMBER}`
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
              per_page: 1,
            })
            core.setOutput('exists', data.length ? 'true' : 'false')
            core.setOutput('url', data[0]?.html_url || '')
            core.setOutput('branch', branch)

      - name: Comment on the existing PR
        if: steps.existing.outputs.exists == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          EXISTING_PR_URL: ${{ steps.existing.outputs.url }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `这个投稿已经有一个开放的 PR：${process.env.EXISTING_PR_URL}`,
            })

      - name: Normalize submission data
        id: append
        if: steps.existing.outputs.exists != 'true'
        continue-on-error: true
        run: |
          if [ "$SUBMISSION_MODE" = "update" ]; then
            node scripts/update-submission.mjs
          else
            node scripts/append-submission.mjs
          fi

      - name: Explain invalid submission
        if: steps.existing.outputs.exists != 'true' && steps.append.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RESULT_FILE: submission-result.json
          SUBMISSION_MODE: ${{ env.SUBMISSION_MODE }}
        with:
          script: |
            const fs = require('node:fs')
            const result = JSON.parse(fs.readFileSync(process.env.RESULT_FILE, 'utf8'))
            const errors = (result.errors || []).map((error) => `- ${error}`).join('\n')
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-info'],
            })
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `${process.env.SUBMISSION_MODE === 'update' ? '这个更新暂时还不能生成 PR' : '这个投稿暂时还不能生成 PR'}，请补充或修正以下内容：\n\n${errors}`,
            })

      - name: Push submission branch
        if: steps.existing.outputs.exists != 'true' && steps.append.outcome == 'success' && steps.append.outputs.changed == 'true'
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
          WORK_TITLE: ${{ steps.append.outputs.work_title }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add src/data/submissions.json
          if [ "$SUBMISSION_MODE" = "update" ]; then
            git commit -m "fix(submission): update $WORK_TITLE from issue #${ISSUE_NUMBER}"
          else
            git commit -m "feat(submission): add $WORK_TITLE from issue #${ISSUE_NUMBER}"
          fi
          git push --set-upstream origin "$BRANCH"

      - name: Create submission PR
        if: steps.existing.outputs.exists != 'true' && steps.append.outcome == 'success' && steps.append.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          BRANCH: ${{ steps.existing.outputs.branch }}
          WORK_TITLE: ${{ steps.append.outputs.work_title }}
          SUBMISSION_MODE: ${{ env.SUBMISSION_MODE }}
        with:
          script: |
            const body = [
              process.env.SUBMISSION_MODE === 'update' ? '## 更新洛天依档案条目' : '## 洛天依同人作品投稿',
              '',
              `- 作品标题：${process.env.WORK_TITLE}`,
              `- Submission ID: ${process.env.WORK_TITLE}`,
              `- 原 Issue：#${context.issue.number}`,
              `- 投稿人：@${context.payload.issue.user.login}`,
              '',
              `Related to #${context.issue.number}`,
              '',
              process.env.SUBMISSION_MODE === 'update'
                ? '这是由 Issue 更新 Action 自动生成的 PR。请确认变更内容与版权声明，再合并。'
                : '这是由 Issue 投稿 Action 自动生成的 PR。请先确认内容与版权声明，再合并。',
            ].join('\n')
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: process.env.BRANCH,
              base: 'main',
              title: process.env.SUBMISSION_MODE === 'update'
                ? `fix(submission): update ${process.env.WORK_TITLE} from issue #${context.issue.number}`
                : `feat(submission): add ${process.env.WORK_TITLE} from issue #${context.issue.number}`,
              body,
              maintainer_can_modify: true,
            })
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `投稿已整理为 PR：${pr.html_url}\n\n等待构建检查与维护者审核。`,
            })
