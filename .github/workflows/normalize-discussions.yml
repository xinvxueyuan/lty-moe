name: Normalize Discussions database

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write
  pull-requests: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    concurrency:
      group: normalize-discussions
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Discussions and generate snapshots
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/discussions.mjs

      - name: Create or update snapshot PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/submissions.json src/data/authors.json; then
            echo 'No snapshot changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='automation/normalize-discussions'
          git switch -C "$branch"
          git add src/data/submissions.json src/data/authors.json
          git commit -m 'chore(data): normalize Discussions snapshot'
          git push --force-with-lease --set-upstream origin "$branch"
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title 'chore(data): normalize Discussions snapshot' \
              --body '由每日 Discussions 归一化 Action 生成，请审核后合并。'
          fi
