name: Normalize Discussions database

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      migrate_existing:
        description: 'Create Discussions for legacy JSON submissions that do not have one yet'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      discussions: write
      pull-requests: write
    concurrency:
      group: normalize-discussions
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Discussions and generate snapshots
        env:
          DISCUSSIONS_TOKEN: ${{ secrets.DISCUSSIONS_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_DISCUSSIONS: ${{ inputs.migrate_existing == true }}
        run: node scripts/discussions.mjs

      - name: Upload normalization report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discussions-normalization-report
          path: ${{ runner.temp }}/discussion-normalization-report.json
          if-no-files-found: ignore

      - name: Create or update snapshot PR
        env:
          GH_TOKEN: ${{ secrets.DISCUSSIONS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/data/submissions.json src/data/authors.json; then
            echo 'No snapshot changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='automation/normalize-discussions'
          git switch -C "$branch"
          git add src/data/submissions.json src/data/authors.json
          git commit -m 'chore(data): normalize Discussions snapshot'
          git push --force-with-lease --set-upstream origin "$branch"
          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title 'chore(data): normalize Discussions snapshot' \
              --body '由每日 Discussions 归一化 Action 生成，请审核后合并。'
          fi
