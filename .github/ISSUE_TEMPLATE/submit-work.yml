name: 洛天依同人作品投稿
description: 把你的曲绘、插画、PV 或 3D 作品送进天依档案。
title: '[投稿] '
labels:
  - submission:work
  - awaiting-review
body:
  - type: markdown
    attributes:
      value: |
        感谢你为洛天依留下新的声音与画面。请提交你拥有发布权的作品。
        图片请直接拖拽到“作品图片”字段，GitHub 会生成附件链接。

  - type: input
    id: work_title
    attributes:
      label: 作品标题 / Work title
      placeholder: 例如：天依蓝的夏天
    validations:
      required: true

  - type: input
    id: creator_name
    attributes:
      label: 创作者名称 / Creator name
      placeholder: 你的昵称或署名
    validations:
      required: true

  - type: input
    id: creator_handle
    attributes:
      label: 创作者主页 ID / Creator handle
      description: 可填写 GitHub、Bilibili、微博或其他平台 ID，不需要带 @。
      placeholder: creator_id

  - type: dropdown
    id: category
    attributes:
      label: 作品类型 / Category
      options:
        - 插画
        - 曲绘
        - PV / 动画
        - 3D
        - 其他
    validations:
      required: true

  - type: textarea
    id: image
    attributes:
      label: 作品图片 / Artwork image
      description: 必填。请直接把一张图片拖到这里，等待 GitHub 生成 user-attachments 链接。
      placeholder: 将图片拖到这里...
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 作品简介 / Description
      description: 介绍作品、创作缘起，或写一句你想对天依说的话。
      placeholder: 这是一张关于……的作品。
    validations:
      required: true

  - type: input
    id: source_url
    attributes:
      label: 原作链接 / Source link
      description: 可选。填写作品原帖、视频或个人主页的 HTTPS 链接。
      placeholder: https://...

  - type: dropdown
    id: license
    attributes:
      label: 许可证 / License
      description: 请选择别人可以如何使用这件作品。
      options:
        - All rights reserved / 保留所有权利
        - CC BY 4.0
        - CC BY-NC 4.0
        - CC BY-NC-SA 4.0
        - 其他（请在作品简介中说明）
    validations:
      required: true

  - type: textarea
    id: maintainers
    attributes:
      label: 维护者 / Maintainers
      description: 可选。一行填写一位负责维护此条目的人员或组织。
      placeholder: |-
        @creator
        @archive-editor

  - type: textarea
    id: co_authors
    attributes:
      label: 共同作者 / Co-authors
      description: 可选。一行填写一位共同作者；没有共同作者可以留空。
      placeholder: |-
        @co-author

  - type: dropdown
    id: ai_disclosure
    attributes:
      label: AI 使用声明 / AI disclosure
      description: 请如实说明生成式 AI 是否参与了这件作品。
      options:
        - 未使用生成式 AI
        - 使用 AI 辅助创作
        - 主要由 AI 生成
    validations:
      required: true

  - type: dropdown
    id: origin
    attributes:
      label: 作品来源 / Origin
      description: 请区分这是你/团队原创的作品，还是经过授权转载的作品。
      options:
        - 原创
        - 转载
    validations:
      required: true

  - type: checkboxes
    id: copyright
    attributes:
      label: 版权确认 / Copyright confirmation
      options:
        - label: 我确认这是我的作品，或我拥有将其发布到天依档案的授权。
          required: true
