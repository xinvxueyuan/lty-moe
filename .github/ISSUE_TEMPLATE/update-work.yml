name: 更新天依档案条目
description: 修改已经发布到天依档案的作品信息和版权元数据。
title: '[更新] '
labels:
  - submission:update
  - awaiting-review
body:
  - type: markdown
    attributes:
      value: |
        这里用于更新已经发布的投稿条目。作品 ID 可以从作品详情页链接中找到，例如 `issue-12`。
        提交后会生成一个 PR，维护者审核后才会发布更新。

  - type: input
    id: work_id
    attributes:
      label: 作品 ID / Work ID
      description: 只允许更新已经发布的 Issue 投稿条目，不支持修改种子作品。
      placeholder: issue-12
    validations:
      required: true

  - type: input
    id: work_title
    attributes:
      label: 作品标题 / Work title
      description: 可选。留空表示不修改现有标题。

  - type: input
    id: creator_name
    attributes:
      label: 创作者名称 / Creator name
      description: 可选。留空表示不修改。

  - type: input
    id: creator_handle
    attributes:
      label: 创作者主页 ID / Creator handle
      description: 可选。留空表示不修改，不需要带 @。

  - type: dropdown
    id: category
    attributes:
      label: 作品类型 / Category
      options:
        - 不修改 / Keep current
        - 插画
        - 曲绘
        - PV / 动画
        - 3D
        - 其他

  - type: textarea
    id: image
    attributes:
      label: 作品图片 / Artwork image
      description: 可选。拖入新的 GitHub Issue 附件图片即可替换现有图片。

  - type: textarea
    id: description
    attributes:
      label: 作品简介 / Description
      description: 可选。留空表示不修改现有简介。

  - type: input
    id: source_url
    attributes:
      label: 原作链接 / Source link
      description: 可选。填写新的 HTTPS 链接，或填写“清空 / Clear”移除现有链接。

  - type: dropdown
    id: license
    attributes:
      label: 许可证 / License
      options:
        - 不修改 / Keep current
        - All rights reserved / 保留所有权利
        - CC BY 4.0
        - CC BY-NC 4.0
        - CC BY-NC-SA 4.0
        - 其他（请在作品简介中说明）

  - type: textarea
    id: maintainers
    attributes:
      label: 维护者 / Maintainers
      description: 可选。一行一位；留空不修改，填写“清空 / Clear”移除现有维护者。

  - type: textarea
    id: co_authors
    attributes:
      label: 共同作者 / Co-authors
      description: 可选。一行一位；留空不修改，填写“清空 / Clear”移除现有共同作者。

  - type: dropdown
    id: ai_disclosure
    attributes:
      label: AI 使用声明 / AI disclosure
      options:
        - 不修改 / Keep current
        - 未使用生成式 AI
        - 使用 AI 辅助创作
        - 主要由 AI 生成

  - type: dropdown
    id: origin
    attributes:
      label: 作品来源 / Origin
      description: 可选。留空或选择“不修改”表示保持现有来源。
      options:
        - 不修改 / Keep current
        - 原创
        - 转载

  - type: checkboxes
    id: copyright
    attributes:
      label: 版权确认 / Copyright confirmation
      options:
        - label: 我确认这些更新内容真实，并且我拥有修改或发布它们的授权。
          required: true
